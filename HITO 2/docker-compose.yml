services:
  db:
    image: mysql:8.4
    container_name: daw_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: BD_AULAS
      MYSQL_USER: Bruno
      MYSQL_PASSWORD: Melon2025?
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Ejecuta automáticamente scripts al crear el volumen por primera vez
      - "./Scripts BBDD:/docker-entrypoint-initdb.d:ro"
    command: --lower_case_table_names=1

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: daw_pma
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8081:80"

  api:
    image: php:8.2-apache
    container_name: daw_api
    depends_on:
      - db
    ports:
      - "8080:80"
    volumes:
      - "./API:/var/www/html"
      # Para que cuadre con ../Config/Config.json
      - "./Config:/var/www/Config:ro"
    environment:
      APP_CONFIG_PATH: /var/www/Config/Config.json
    command: >
      bash -lc "docker-php-ext-install mysqli pdo pdo_mysql && apache2-foreground"

volumes:
  db_data:
